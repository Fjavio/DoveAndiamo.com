version: '3.8'

services:
  backend:
    build: .
    container_name: jammo_backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Aggiungiamo questa riga per dire a Python dove trovare le cartelle "api", "db", ecc.
      - PYTHONPATH=/app/backend
    volumes:
      # Monta una cartella locale per non perdere i dati del database SQLite al riavvio
      - ./data:/app/data 
    networks:
      - jammo_network

  frontend:
    build: .
    container_name: jammo_frontend
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Indica al frontend come chiamare le API del backend (usa il nome del servizio "backend")
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - jammo_network

networks:
  jammo_network:
    driver: bridge